    <linearGradient id="cyan-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d6ff"/>
      <stop offset="1" stop-color="#16324a"/>
    </linearGradient>
  </defs>
  <style>
