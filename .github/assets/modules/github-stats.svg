<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="928" height="166" viewBox="0 0 928 166" role="img" aria-labelledby="title description">
  <title id="title">Live GitHub statistics</title>
  <desc id="description">24 stars, 270 authored commits and 23 public repositories.</desc>
  <defs>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020a14"/>
      <stop offset="1" stop-color="#071421"/>
