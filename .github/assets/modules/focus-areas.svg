        <circle cx="28" cy="31" r="11" fill="none" stroke="#27d9a0" stroke-width="3"/>
        <text x="52" y="29" fill="#27d9a0" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="13" font-weight="700">ROBOTICS</text>
